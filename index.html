<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d5af1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Free Fall">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Free Fall — Trap Platformer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="rotateOverlay">
  <div>🔄<br>Rotate your phone to landscape<br>to play.</div>
</div>
<div id="app">
  <header id="topbar">
    <button id="menuBtn" class="iconBtn" aria-label="Menu">☰</button>
    <div id="titleBlock">
      <span id="levelName">—</span>
      <span id="levelDiff">—</span>
    </div>
    <button id="installBtn" class="iconBtn" aria-label="Install">⬇</button>
  </header>

  <main id="stage">
    <div id="canvasWrap">
      <canvas id="game" width="800" height="450"></canvas>
    </div>
  </main>

  <footer id="controlsBar">
    <div class="dpad">
      <button id="btnLeft" class="ctrl">◀</button>
      <button id="btnRight" class="ctrl">▶</button>
    </div>
    <button id="btnJump" class="ctrl ctrlJump">⤒</button>
  </footer>
</div>

<div id="drawerBackdrop"></div>
<aside id="drawer">
  <button id="closeDrawer" class="iconBtn">✕</button>
  <h3>Levels</h3>
  <div id="levelMapWrap">
    <svg id="levelMapPath"></svg>
    <div id="levelMapNodes"></div>
  </div>
  <button id="btnImportLevel" class="drawerBtn">Import a level (JSON)</button>
  <input id="fileImportLevel" type="file" accept="application/json" hidden>
  <h3>Selected level stats</h3>
  <div id="statsBlock"></div>
  <h3>Traps discovered</h3>
  <div id="trapLog"></div>
  <h3>Controls</h3>
  <p class="hint">Arrows / A-D: move · Space / Up: jump · R: restart<br>On mobile: touch buttons at the bottom of the screen.</p>
</aside>

<script src="js/firebase-config.js"></script>
<script src="js/firebase-rest.js"></script>
<script src="js/levels.js"></script>
<script src="js/engine.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
